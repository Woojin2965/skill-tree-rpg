[package]
name = "knowledge-rpg"
version = "0.1.0"
edition = "2024"

[lib]
path = "server/lib.rs"

# Vercel builds each api/*.rs listed here into one function.
[[bin]]
name = "index"
path = "api/index.rs"

[dependencies]
axum = "0.8"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
vercel_runtime = { version = "2.4", features = ["axum"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
